org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Keep memory low on this machine: compile Kotlin inside the Gradle daemon
kotlin.compiler.execution.strategy=in-process
# Disable incremental caches (their .tab state writes fail on this filesystem)
kotlin.incremental=false
