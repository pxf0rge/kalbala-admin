name: kalbala_admin
description: KalBala admin panel for marketplace moderation and operations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.1
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0E321E"
  adaptive_icon_foreground: assets/branding/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/branding/app_icon.png
    - assets/branding/login_hero.png
    - assets/branding/login_skyline.png
